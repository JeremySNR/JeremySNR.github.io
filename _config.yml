title: Jeremy Smith
tagline: AI, infrastructure, and who ends up owning it
description: >-
  Essays on artificial intelligence, sovereign compute and the industrial
  decisions Britain is making, or failing to make, right now.
author: Jeremy Smith
url: "https://jeremysnr.github.io"
baseurl: ""
lang: en_GB

# Publish posts even if their timestamp is slightly ahead of GitHub's build
# clock, which runs on UTC. Without this, a post written and pushed on the
# same morning silently vanishes until the clock catches up.
future: true

# No theme. Layouts live in _layouts and the CSS is plain, hand-written and tiny.
permalink: /:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
